name: Build verified photo overrides

on:
  push:
    branches: [main]
    paths:
      - "data/afl_photo_index.json"
      - "data/player_status.csv"
      - "scripts/build_photo_overrides.mjs"
      - ".github/workflows/build-photo-overrides.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-overrides:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test AFL photos and find verified fallbacks
        run: node scripts/build_photo_overrides.mjs
      - name: Commit verified photo overrides
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/photo_overrides.json
          if git diff --cached --quiet; then
            echo "No override changes"
          else
            git commit -m "Build verified player photo overrides"
            git push
          fi
