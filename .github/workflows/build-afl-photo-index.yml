name: Build AFL photo index

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-afl-photo-index.yml"
      - "scripts/build_afl_photo_index.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: afl-photo-index
  cancel-in-progress: true

jobs:
  build-photo-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build AFL.com.au photo index
        run: node scripts/build_afl_photo_index.mjs
      - name: Commit updated photo index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/afl_photo_index.json
          if git diff --cached --quiet; then
            echo "No photo index changes"
          else
            git commit -m "Build local AFL.com.au player photo index"
            git pull --rebase origin main
            git push
          fi
